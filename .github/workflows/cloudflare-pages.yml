name: Deploy to Cloudflare Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check Cloudflare API token
        id: cloudflare_token
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deployment skipped. Add the CLOUDFLARE_API_TOKEN Actions secret to this repository to enable Cloudflare Pages deployments."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare_token.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7a40b8466753962ea417bf20622b1292
          command: pages deploy . --project-name=skxx-web-github-io --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
