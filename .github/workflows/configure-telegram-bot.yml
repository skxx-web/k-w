name: Configure Telegram bot Worker secrets
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: configure-telegram-bot-secrets
  cancel-in-progress: false
jobs:
  transfer-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: telegram-bot/package-lock.json
      - name: Install pinned Wrangler
        working-directory: telegram-bot
        run: npm ci --ignore-scripts
      - name: Transfer credentials to Cloudflare Worker Secrets
        working-directory: telegram-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_IDS: ${{ secrets.TELEGRAM_ADMIN_IDS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_ADMIN_IDS" ]]; then
            echo "Required encrypted repository secrets are missing."
            exit 1
          fi
          if [[ ! "$TELEGRAM_ADMIN_IDS" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
            echo "TELEGRAM_ADMIN_IDS must contain numeric Telegram IDs separated by commas."
            exit 1
          fi
          printf '%s\n' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
          printf '%s\n' "$TELEGRAM_ADMIN_IDS" | npx wrangler secret put TELEGRAM_ADMIN_IDS
          echo "Telegram bot credentials were transferred to Cloudflare Worker Secrets."
